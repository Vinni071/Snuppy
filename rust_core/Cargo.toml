[package]
name = "ide_engine"
version = "0.1.0"
edition = "2021"
description = "Snuppy - Educational compiler engine for teaching programming logic and compilers"
authors = ["Vinicius Rodrigues da Costa"]

[lib]
name = "ide_engine"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ide-cli"
path = "src/bin/cli.rs"

[dependencies]
logos = "0.16"
chumsky = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ariadne = "0.5"
flutter_rust_bridge = "=2.12.0"

[dev-dependencies]
pretty_assertions = "1"

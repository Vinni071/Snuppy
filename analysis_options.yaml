# Static analysis for Luminthor. Run with `flutter analyze`.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated by flutter_rust_bridge/freezed; regenerate instead of editing.
    - lib/src/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # Consistent, move-safe imports across features.
    always_use_package_imports: true
    directives_ordering: true
    # Async safety: fire-and-forget futures must be explicit (`unawaited`).
    unawaited_futures: true
    discarded_futures: false
    # Resource disposal.
    cancel_subscriptions: true
    close_sinks: true
    # Immutability and rebuild cost.
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_fields: true
    prefer_final_locals: true
    # Error handling.
    only_throw_errors: true
    use_rethrow_when_possible: true
